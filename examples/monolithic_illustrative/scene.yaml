# Illustrative: Sersic lens light, external shear and an exponential source.
run_name: monolithic_illustrative
seed: 11
cosmology: {name: Planck15}
scene:
  grid: {shape: [120, 120], pixel_scale_arcsec: 0.04, over_sample_size: 4}
  lens:
    redshift: 0.4
    mass:
      main: {type: Isothermal, centre: [0.0, 0.0], einstein_radius: 1.2, ell_comps: [0.05, 0.0]}
      shear: {type: ExternalShear, gamma_1: 0.02, gamma_2: -0.01}
    light:
      bulge: {type: Sersic, centre: [0.0, 0.0], ell_comps: [0.1, 0.0], sersic_index: 4.0,
              effective_radius: 0.8, flux: {ab_mag: 19.5}}
  source:
    redshift: 1.5
    light:
      disk: {type: Exponential, centre: [-0.05, 0.10], ell_comps: [0.05, 0.10],
             effective_radius: 0.15, flux: {ab_mag: 23.5}}
  subhalo: {type: NFW, concentration: {kind: moline2017_eq7, x_sub: 1.0}}
