# Paper-parity scene p3_image_source_kernel: synthetic image source and an externally supplied detector kernel.
# Written by tests/scripts/generate_paper_parity.py; the paper-side
# configuration used for the expected values is in manifest.json.
run_name: paper_parity_p3
global_seed: 11
lensing:
  grid:
    shape: [100, 100]
    pixel_scale: 0.03
    over_sample_size: 4
  lens_galaxy:
    redshift: 0.2
    mass:
      type: Isothermal
      einstein_radius: 1.0
      centre: [0.0, 0.0]
      ell_comps: [0.1, 0.0]
  source_galaxy:
    redshift: 0.6
    light:
      type: Image
      asset_path: source_image.npz
      centre: [-0.03, 0.08]
      rotation_deg: 30.0
      total_flux: 0.29
      flux_scale: 1.0
      size_scale: 1.0
  subhalo:
    enabled: true
    mass: 100000000.0
    model: NFW
    concentration: {model: moline2017_eq7, x_sub: 1.0, h: null}
    position: {type: angle, angle: 90.0, offset_pixels: 0}
  cosmology: Planck15
psf:
  provider: kernel
  kernel: {path: detector_kernel.npy, pixel_scale_arcsec: 0.03, normalize: true}
observation:
  exposure_time: 900.0
  throughput: 1.0
  detector: {gain: 1.0, read_noise: 0.2, dark_current: 0.002, sky_background: 1.0}
modeling:
  fisher:
    snr_threshold: 3.0
    include_background_offset: true
    finite_diff: {centre_arcsec: 0.001, einstein_radius_arcsec: 0.001, ell_comp: 0.001,
      source_intensity_frac: 0.01, source_reff_frac: 0.01}
    mask_mode: all_pixels
    include_psf_nuisance: false
    compute_psf_mode_scan: false
    map:
      type: grid
      grid: {spacing_arcsec: 0.6, half_width_arcsec: 1.2, annulus: null}
