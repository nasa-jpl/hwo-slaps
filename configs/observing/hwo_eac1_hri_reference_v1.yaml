metadata:
  reference_name: hwo_eac1_hri_reference_v1
  script: derive_hwo_eac1_hri_reference.py
  script_version: '3'
  generation_date: '2026-08-23'
  observation_model_semantics: Source normalization is solved so the production render
    sums to the detected e-/s rate, so observation.throughput stays 1.0 and the throughput
    chain below is provenance only; carrying both would double-apply it.
  source_photometry:
    input_magnitude_ab: 24.3
    input_band: F814W
    input_magnitude_note: 'Median magnification-corrected apparent magnitude of the
      46-source SLACS emission-line sample; the anchor is intrinsic, not observed
      through the lens. Newton et al. 2011 Table 1 measured medians: I814 24.13 (full
      46-source sample) and 24.20 (z_s 0.4-0.8 subset, n=34), per-source photometric
      uncertainty 0.3 mag; the ruled D1 value adopts 24.3 F814W + 0.545 color to V
      at 500 nm.'
    input_citation: L1
    sed_mode: vband_photometry
    sed_mode_description: measured V-band source photometry used directly
    color_ab: null
    measured_vband_magnitude_ab: 24.845
    derived_magnitude_ab: 24.845
    derived_band: HRI-V
    flux_density_jy: 4.18818877914838e-07
    photon_rate_ph_per_s_m2: 1.2683939892161928
    detected_rate_e_per_s: 8.951505744562876
    normalization_plane: unlensed intrinsic source-plane total flux; this artifact
      applies no magnification and no lensing
  band:
    name: HRI-V
    definition: study-defined 20 percent wide band centred at 500 nm
    centre_m: 5.0e-07
    fractional_width: 0.2
    lambda_min_m: 4.5e-07
    lambda_max_m: 5.5e-07
    citations:
    - S6
    - S4
  collecting_area:
    value_m2: 33.606448937520405
    method: sum of the supersampled hcipy pupil mask times the pupil-grid cell area
      (pupil_diameter / num_pix) ** 2, no thresholding
    gapless_hexagon_area_m2: 33.59799680569466
    gapless_hexagon_formula: num_segments * 3 * sqrt(3) / 8 * segment_point_to_point
      ** 2
    mask_to_hexagon_ratio: 1.0002515665405478
    gap_loss_fraction: -0.0002515665405478096
    gap_loss_note: gap_loss_fraction is 1 - mask_to_hexagon_ratio and can be slightly
      negative because fractional edge coverage on the finite pupil grid outweighs
      the 6 mm gap loss
    accepted_ratio_bounds:
    - 0.95
    - 1.005
    num_segments: 19
    geometry_source: configs/master_config.yaml psf.telescope and psf.hres_psf
    geometry:
      gap_size_m: 0.006
      segment_point_to_point_m: 1.65
      pupil_diameter_m: 7.225765
      num_rings: 2
      supersampling_factor: 4
      num_pix: 512
    aperture_citation: S1
    aperture_note: 'EAC1-like area-matched pupil: 19 hexagonal segments, 1.65 m point-to-point
      against the EAC1 1.7 m, 33.6 m^2 official area. The S3 USORT yield aperture
      (6.5 m inscribed, 7.87 m circumscribed) is a different aperture and is never
      mixed in.'
  throughput_chain:
    name: luvoir_hdi_system_qe
    value: 0.21
    description: end-to-end LUVOIR HDI system QE at V, detector included
    citation: S4
    optimistic_chain_bracket:
      value: 0.5040000000000001
      optical_throughput: 0.56
      detector_qe: 0.9
      citation: S3
      used_in_baseline: false
    applied_to: the derived source and sky rates in this artifact only
  instrument_reference:
    name: HWO Science Engineering Interface
    package: hwo_sci_eng
    version: 0.1.9
    status: current public HWO working engineering reference adopted for this study
    vendored_path: configs/observing/sei_v0.1.9
    data_files_read:
    - HRI.yaml
    - EAC1.yaml
    data_file_sha256:
      HRI.yaml: 8b9c902f58a9af3e5272833dc3d893b8e29a4ace20b12ed84f7ceabb35d5d2e9
      EAC1.yaml: dbb35fd845c37302ef25f095eb4e04c40bad879f084d7febc9bf7f7c27113992
    data_file_note: Every value attributed to the SEI below is parsed out of these
      files on each run and checked against the value this derivation declares; a
      missing file, or one whose cited values moved, fails the run. The digests are
      of the exact bytes parsed, so they move with any edit at all.
    citation: SEI
    adopted_parameters:
      read_noise_per_read_e:
        value: 0.2
        sei_source: HRI.yaml, UVIS channel detector read noise
        replaces: LUVOIR HDI Table 8-5 read noise of 2.5 e- per read [S4], retired
          2026-08-23
    corroborated_parameters:
      pixel_scale_arcsec:
        value: 0.00716
        sei_value: 0.00716
        sei_source: HRI.yaml, UVIS plate scale 7.16 mas
        note: derived independently as Nyquist sampling at 500 nm for the circumscribed
          pupil diameter and equal to the SEI value
      dark_current_e_per_pix_s:
        value: 0.002
        sei_value: 0.002
        sei_source: HRI.yaml, UVIS channel dark current
      telescope_geometry:
        value:
          segment_point_to_point_m: 1.65
          gap_size_m: 0.006
          pupil_diameter_m: 7.225765
          num_rings: 2
          num_segments: 19
        sei_source: EAC1.yaml, PM segmentation_parameters and circumscribing_diameter
        note: the production pupil geometry read from configs/master_config.yaml psf.telescope
          equals the SEI EAC1 prescription value for value
    caveats: v0.1.9 carries pre-formulation placeholder values and the EAC architectures
      are exploratory. The UVIS filter transmission curves referenced by HRI.yaml
      are not shipped in the wheel, so the throughput chain in this artifact is not
      taken from the SEI.
  detector:
    gain_e_per_adu: 1.0
    pixel_scale_arcsec: 0.00716
    pixel_solid_angle_arcsec2: 5.126559999999999e-05
    pixel_scale_source: configs/master_config.yaml lensing.grid.pixel_scale
    pixel_scale_note: Nyquist sampling at 500 nm for the circumscribed pupil diameter;
      HWO publishes no HRI pixel scale.
    sky_surface_brightness_ab_per_arcsec2: 23.0
    sky_band: V
    sky_description: zodiacal light, uniform, HWO exposure-time-calculator convention
    sky_citation: S3
    sky_rate_e_per_pix_s: 0.002510279845963486
    qualification_sky_background_e_per_pix_s: 1.0
    read_noise_per_read_e: 0.2
    n_reads: 2
    effective_read_noise_e: 0.28284271247461906
    effective_read_noise_formula: per_read_e * sqrt(n_reads)
    read_noise_note: The noise model applies exactly one squared read-noise term,
      so observation.detector.read_noise carries the effective combined-image value
      and never the per-read value.
    read_noise_citation: SEI
    read_noise_description: HRI UVIS read noise from the SEI HRI.yaml, the current
      public HWO working engineering reference adopted for this study
    read_noise_retired_provenance: 'The derivation carried the LUVOIR HDI Table 8-5
      value of 2.5 e- per read [S4] until 2026-08-23, when the SEI became the authoritative
      instrument source. That value is recorded here as provenance history only: it
      is not a configured value and it is not a bracket.'
    dark_current_e_per_pix_s: 0.002
    dark_current_description: LUVOIR HDI heritage, equal to the SEI HRI UVIS value
    dark_current_citation: S4
    dark_current_corroboration_citation: SEI
  exposure:
    value_s: 2000.0
    description: HST full-orbit-class exposure (~2000 s)
  source_normalization_details:
    target_rate_e_per_s: 8.951505744562876
    units: detected electrons per second, unlensed intrinsic source total
    convention: Scene light normalizations are continuous surface-brightness amplitudes,
      never detected totals. The observation layer reads rendered samples directly
      as per-pixel e-/s, so every patch is solved on the scene production grid until
      the unlensed discrete pixel sum equals target_rate_e_per_s. The recorded patched
      profile angular integral is the baseline closed-form integral times the scale
      factor, approximately pixel_area_arcsec2 times that rate, and is not itself
      a detected rate.
    pixel_scale_arcsec: 0.00716
    pixel_area_arcsec2: 5.126559999999999e-05
    render_method: 'unlensed source galaxy from hwoslaps.lensing.generator._create_source_galaxy
      evaluated on hwoslaps.lensing.generator._create_grid: the exact production constructors,
      grid geometry, and sub-pixel oversampling'
    scaling_note: Every source family is exactly linear in its normalized field, so
      the realized rate is the baseline discrete sum times the scale factor.
    discrete_mapping_tolerance: 0.01
    qualification_profile_angular_integral: 0.289151264
    qualification_intensity: 2.0
    qualification_effective_radius_arcsec: 0.11
    qualification_closed_form: F_tot = 2 * pi * exp(b1) / b1 ** 2 * intensity * effective_radius
      ** 2
    qualification_closed_form_value: 0.28915126403243807
    qualification_note: The frozen qualification normalization is a profile angular
      integral in profile units, not a detected electron rate.
    sersic_b1: 1.6783886549215685
    sersic_b1_note: AutoGalaxy sersic_constant polynomial at n = 1, the constant the
      installed profile code uses; the exact root of (1 + b) exp(-b) = 1/2 is 1.6783469900166605
      and misses the frozen qualification flux by 8e-6 relative.
