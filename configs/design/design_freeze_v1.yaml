# DesignFreeze_v1: the single machine-readable design authority for the
# HWO-SLAPS production campaign.
#
# Sol Pro go-time finding P0-4 requires exactly one design artifact that every
# agent, driver and manifest consumes. This is that artifact. Where any plan
# document, report or brief disagrees with this file, THIS FILE WINS and the
# document is stale; the superseded documents carry a banner pointing here.
#
# STATUS: RATIFIED, version 3 (amended 2026-09-01). Every item the
# version-1 freeze left provisional was ruled by George on 2026-08-23; the
# rulings are recorded under `ratifications` below and the provisional list is
# empty. The version-2 amendment also carries the A2 declared spacing
# systematic, the A5 compact-template swap (cosmos_127283 for cosmos_83935),
# the A6-2 golden-magnitude re-anchor (23.795 V), the A6-1 XeLiF-only ruling,
# the SEI promotion into configs/, and the committed pre-registration and
# golden-anchor bindings. Numbers remain provisional until the GPT Pro review
# per `claim_labels.provisionality`. The version-3 amendment adds the
# `nonlinear_validation` block: the pre-declared protocol and sampler seed
# rule for the post-campaign nonlinear validation of the production ladder
# results. It changes nothing about the ladder campaigns themselves.
#
# Conventions. Angles are arcseconds. Signal is electrons in the exposure and
# variance is electrons squared. Masses are log10 solar. Paths are repo-root
# relative. Every `sha256` is the full 64-hex digest of the named file's bytes.
#
# Consumers. `hwoslaps.campaign.design_freeze` loads and validates this file;
# `hwoslaps.campaign.stage0` turns it into the Stage 0 S1-lite campaign. No
# driver may re-declare a value that appears here.

schema_version: 1

