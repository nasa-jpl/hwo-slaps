# DesignFreeze_v1: the single machine-readable design authority for the
# HWO-SLAPS production campaign.
#
# Sol Pro go-time finding P0-4 requires exactly one design artifact that every
# agent, driver and manifest consumes. This is that artifact. Where any plan
# document, report or brief disagrees with this file, THIS FILE WINS and the
# document is stale; the superseded documents carry a banner pointing here.
#
# STATUS: PROVISIONAL. Frozen under the 2026-08-23 overnight launch authority
# so Stage 0 can start tonight. Every entry of `provisional_items` needs
# George's and Sol Pro's ratification on the morning of 2026-08-24 BEFORE any
# result produced under this freeze is used in the paper. Stage 0 is cheap and
# resumable, so an amended design re-runs at small cost.
#
# Conventions. Angles are arcseconds. Signal is electrons in the exposure and
# variance is electrons squared. Masses are log10 solar. Paths are repo-root
# relative. Every `sha256` is the full 64-hex digest of the named file's bytes.
#
# Consumers. `hwoslaps.campaign.design_freeze` loads and validates this file;
# `hwoslaps.campaign.stage0` turns it into the Stage 0 S1-lite campaign. No
# driver may re-declare a value that appears here.

schema_version: 1

freeze:
  name: design_freeze_v1
  version: 1
  status: provisional
  authored: '2026-08-23'
  ratified: null
  ratification_owner: George, with Sol Pro concurrence
  authority: >-
    Frozen under the overnight launch authority George granted in chat on
    2026-08-23 and the Sol Pro CONDITIONAL GO ruling archived at
    scratch/SolPro_gotime_signoff/. The declared deviation is that the B8
    parent design is frozen provisionally rather than ratified first; see
    scratch/OvernightExecutionPlan_2026-08-23.md task T10.
  origin_finding: P0-4
  supersedes:
    - path: scratch/RedesignExecutionPlan.md
      reason: >-
        Carries the stale Stage 0 = 500 pool with 32/8/4 strata and the retired
        oracle-subtraction foreground treatment.
    - path: scratch/q1_observing_conditions/derivation_notes.md
      reason: >-
        Pre-P0-3 source-normalization notes; superseded by the discrete
        detected-rate contract carried on the prepared assets.
  authoritative_over: >-
    Campaign counts, strata, seeds, the parent design, the selection rule, the
    aperture algorithm and its factor, the mass-ladder policy, the detector and
    throughput values, the template bank, and every claim label.

# ---------------------------------------------------------------------------
# What still needs a signature in the morning
# ---------------------------------------------------------------------------
# Exactly these four items are unratified. Nothing else in this file is open.
provisional_items:
  - id: parent_design
    summary: >-
      The whole B8 joint parent design embedded below under `parent_design`,
      including every distribution carrying `provisional: true`.
    ratify: >-
      George and Sol Pro accept or amend the marginals, the bounds and the
      declared couplings. An amendment invalidates this freeze's hash and
      re-runs Stage 0.
    reference: scratch/B8ParentDesign_v1.md section 11
  - id: representative_48_semantics
    summary: >-
      The parent tier of 48 is a deterministic stratified representative
      subsample of the post-cut pool, NOT the top 48 by the selection score.
    ratify: >-
      One line from George. The T10 task brief said "top-48 by the T4 score";
      RedesignExecutionPlan S0 and the Sol Pro W2/W3 three-strata prescription
      both require a representative draw so the middle stratum can demonstrate
      the improvement from observable target selection. Resolved here in favour
      of the representative draw; a top-48 parent would delete main-result
      item 3.
    reference: scratch/B8ParentDesign_v1.md section 9 item 1
  - id: t4_noisy_g_labelling
    summary: >-
      Whether the selection is labelled an idealized no-subhalo proxy selection
      or an operational target selector, which follows from the outcome of the
      T4 noise-seed rank-stability test on noisy observables.
    ratify: >-
      Read the rank-stability numbers (Spearman, top-12 Jaccard,
      oracle-recovered fraction over the 20 declared replicates) and pick the
      label. Sol Pro P0-6 verbatim: unless rank stability is demonstrated using
      noisy or reconstructed observables, call it an idealized no-subhalo proxy
      selection, not an operational Roman/Euclid/HWO target selector.
    reference: scratch/q1_observing_conditions/selection_rule.md section 4
  - id: template_83935_resolution_caveat
    summary: >-
      The compact template cosmos_83935_hlr011 is stored at 0.012148903205522409
      arcsec per pixel, coarser than the 0.00716 arcsec production pixel scale,
      so it is interpolated up on every render and is the least well sampled
      member of the bank.
    ratify: >-
      Accept the caveat and its wording, or replace the compact anchor with the
      declared alternative (ident 174776). The complexity statistic C is a
      gradient statistic, so the compact stratum is the one whose C is most
      exposed to template sampling rather than to source morphology.
    reference: scratch/f3_source_gallery/README.md

# ---------------------------------------------------------------------------
# Claim labels, binding on every sentence that quotes a number from this study
# ---------------------------------------------------------------------------
foreground_free_ceiling: true

claim_labels:
  central_result: >-
    foreground-free, source-only information ceiling
  central_result_rule: >-
    Every central result of this study carries the foreground-free/source-only
    information ceiling label. No lens light and no lens photon noise enter any
    render (D-F6 is ceiling-only), so every sensitivity is an upper bound on
    what a real observation with a lens galaxy in the frame would deliver.
  counts: >-
    idealized upper-bound yields
  counts_rule: >-
    Every expected count, every mu_i and every P(>=1) is an idealized
    upper-bound yield under the ceiling above. Never quote a count as a
    predicted detection number.
  ensemble: >-
    reference ensemble, not a survey population
  ensemble_rule: >-
    Report conditional design quantiles of the reference ensemble, never a
    population mean or a survey-population expectation. The five morphology
    anchors carry equal design allocation rather than population frequencies,
    and the lens-galaxy distributions are calibrated to an observed strong-lens
    sample rather than derived from a velocity-dispersion function with lensing
    cross-section weights. Bootstrap intervals quantify subsampling variability
    WITHIN this ensemble under this design and are never survey-population
    confidence intervals.
  templates: >-
    templates, not a source population
  templates_rule: >-
    The five source anchors are declared morphology TEMPLATES. They are not a
    sample of, and carry no weights toward, the population of lensed sources.
    Any pooled summary over templates is a design average over five declared
    levels, and is always reported beside the five per-template conditional
    summaries.
  provisionality: >-
    Every number produced under this freeze is provisional until the
    2026-08-24 review, and artifacts are labelled accordingly.
  forbidden_phrases:
    - survey population
    - population expectation
    - representative of the lens population
    - expected number of HWO lenses
    - predicted detections

# ---------------------------------------------------------------------------
# Stage 0: the no-subhalo observation pool
# ---------------------------------------------------------------------------
stage0:
  n_systems: 1000
  subhalo: absent
  observation_layer_only: true
  cosmology: Planck15
  pixel_scale_arcsec: 0.00716
  exposure_time_s: 2000.0
  psf_kernel_shape_native: [51, 51]
  psf_state: perfect
  psf_state_note: >-
    Scene PSFs carry no wavefront error. PSF states are sweep axes and are
    never a system property, so Stage 0 renders at the perfect PSF.
  base_scene_config: configs/scenes/scene4_cosmos.yaml
  base_scene_label: scene4_cosmos
  base_scene_note: >-
    Every Stage 0 system is the canonical Image-source scene with the sampled
    macro, source template, geometry and normalization applied as manifest
    overrides. The scene label is also the key the observing reference's
    source_normalization block is read under.
  runner: scripts/run_stage0_observation.py
  artifact: stage0_observation.npz
  job_config_stage0_block: >-
    Every staged job configuration carries a top-level `stage0` block holding
    its system id, template, sampled source magnitude, design theta_E, the
    target unlensed detected rate and the rate-contract tolerance. The engine
    ignores the block; it exists so the P0-3 contract is checkable inside the
    job that renders it rather than by cross-referencing the catalogue after
    the fact, and it is covered by the staged configuration hash.
  artifact_contents: >-
    Per-system selection observables (S, G, C, theta_res), the T7 theta_E_eff
    with its contour and aperture hashes, the aperture census, the realized
    unlensed detected rate against its target, the realized lensed rate, and
    the mandatory campaign_uuid and config_hash identity members. The full
    electron maps are NOT stored: Stage 0 exists to produce selection
    statistics, and every later stage re-renders from the staged config.

# ---------------------------------------------------------------------------
# Strata
# ---------------------------------------------------------------------------
strata:
  parent:
    name: reference ensemble
    size: 48
    mode: stratified_representative_subsample
    provisional: true
    semantics: >-
      A deterministic stratified representative subsample of the post-cut pool,
      NOT the top 48 by the selection score. The score selects only the 12 and
      the 5. The parent tier exists to answer what distribution of selection
      functions a declared parent produces, and to give the paper the
      unselected baseline against which observable target selection is shown to
      improve.
    algorithm:
      - 'Partition the post-cut pool by source template, in the declared level order.'
      - 'Sort each template stratum ascending by theta_E_eff, ties broken by system id.'
      - 'Allocate 9 per template (45); give the remaining 3 to the templates with the largest post-cut counts, ties by declared level order.'
      - 'Within each stratum take the systematic sample at indices floor((j + 0.5) * |P_t| / n_t) for j = 0 .. n_t - 1.'
    rng: none
    properties: >-
      Exactly balanced in morphology and evenly spread over the theta_E design
      quantiles within each morphology. Being a design-quantile-spread
      subsample rather than a random draw is why its summaries are reported as
      conditional design quantiles.
  selected:
    name: operational HWO follow-up sample
    size: 12
    mode: top_by_score
    drawn_from: post_cut_pool
    overlap_with_parent: allowed, expected, recorded as an explicit per-system membership flag
  golden:
    name: sampled golden frontier
    size: 5
    mode: top_by_score_within_selected
    drawn_from: selected
    prohibition: >-
      Sol Pro W2/W3 verbatim: "Do not select the primary 'golden' sample after
      inspecting its true injected-subhalo M_lim." The ranking is frozen and
      hashed into provenance BEFORE the manifest generator emits any
      injected-subhalo job.
  oracle:
    name: oracle top-sensitivity subset
    size: 12
    mode: top_by_measured_M_lim
    status: labelled_upper_bound
    note: >-
      Formed only after the ladders are measured and shown as an explicitly
      labelled upper bound, never as operational selection.
  freeze_order:
    - 'Stage 0 renders 1000 no-subhalo observations.'
    - 'Selection statistics computed on the noiseless source-only truth.'
    - 'Floor cuts applied; post-cut pool fixed.'
    - 'Score computed and standardized over the post-cut pool.'
    - 'Parent 48, selected 12, golden 5 frozen and hashed into provenance.'
    - 'Only then may the manifest generator emit an injected-subhalo job.'

