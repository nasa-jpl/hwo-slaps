# ---------------------------------------------------------------------------
# The five-template source bank
# ---------------------------------------------------------------------------
templates:
  count: 5
  allocation: balanced
  per_level: 200
  assignment: >-
    Exactly 200 systems per level, assigned by a single seeded permutation of
    the 1000 labels under spawn key (3,). Balanced allocation, not a
    multinomial draw, so the morphology factor is exactly orthogonal to pool
    size and the variance decomposition is exactly balanced.
  canonical_half_light_arcsec: 0.11
  size_scale_rule: 'size_scale = source_half_light_radius_arcsec / 0.11'
  rate_contract_policy: >-
    Each asset carries the P0-3 discrete detected-rate contract solved at the
    canonical geometry (size_scale 1.0, rotation 0, the 500 x 500 production
    grid at 0.00716 arcsec per pixel): the unlensed render's discrete sum
    equals the committed detected rate 8.951505744562876 e-/s for the D1
    magnitude 24.845. The Image source evaluates
    total_flux * sb(theta / size_scale) and is exactly linear in total_flux, so
    the manifest sets
    total_flux = canonical_total_flux * 10^(-0.4 * (m_AB - 24.845)) /
    size_scale^2
    and the Stage 0 runner records the REALIZED unlensed rate on that system's
    own grid and size_scale against the target rate
    8.951505744562876 * 10^(-0.4 * (m_AB - 24.845)). The value 0.289151264 is
    an internal morphology-preparation convention only and is never a detected
    e-/s rate.
  size_scale_flux_rule: >-
    Dividing by size_scale^2 is required, not cosmetic: stretching the stamp
    over a larger angular area at fixed surface brightness would otherwise
    multiply its integrated flux by size_scale^2 and silently decouple the
    rendered brightness from the sampled magnitude. The design samples an
    intrinsic magnitude and an intrinsic half-light radius independently, so
    the size factor is divided out and the source carries exactly the sampled
    magnitude's total flux at any sampled size.
  rate_contract_production_tolerance: 0.05
  rate_contract_production_tolerance_rule: >-
    The canonical solve is exact to about one part in 10^4 at the canonical
    geometry. At a sampled size_scale and rotation the bilinear stamp
    resampling moves the discrete sum a little further, so the Stage 0 runner
    fails closed if the realized unlensed rate departs from its target by more
    than this fraction, and records the realized rate and ratio for every
    system either way. A system inside the tolerance but outside one per cent
    is a flag for the harvest, not a failure.
  rate_contract_grid_rule: >-
    The contract is evaluated on a grid sized to contain the whole scaled
    stamp about the sampled source centre, at the production pixel scale, NOT
    on the system's production grid. The production grid is theta_E driven and
    a large sampled source can be wider than it, so gating the normalization on
    the production grid would confound the normalization with grid truncation.
    The unlensed sum on the production grid is recorded separately as
    production_grid_flux_fraction, a truncation diagnostic that says how much
    of the intrinsic source footprint the theta_E-driven map covers.
  magnification_rule: >-
    Magnification is applied exactly once, emergently, by the engine evaluating
    the same surface brightness at ray-traced source-plane positions. No
    magnification factor multiplies any normalization anywhere, and the
    magnitudes of the parent design are unlensed intrinsic source-plane totals.
  declared_idealization: >-
    F814W stamps of z ~ 0.35-1.2 galaxies are used as the sampled z_s source at
    500 nm. The band and rest-frame mismatch is inherited from the existing
    anchor asset, is declared, and is not new to this design.
  levels:
    - id: cosmos_48849
      morphology_class: clumpy_sbar_spiral_existing_anchor
      asset_path: configs/source_assets/cosmos_48849_hlr011.npz
      sha256: c67570fdc56068fc900e3428f6b6ff2d5ffce8f459858c302c6de1461d24ed21
      asset_pixel_scale_arcsec: 0.002732128852944742
      canonical_total_flux: 0.00045889467368609476
      canonical_total_flux_source: provenance.rate_contract.total_flux
      catalog: GalSim COSMOS 23.5 real-galaxy sample (Zenodo 3242143) ident 48849
    - id: cosmos_62410
      morphology_class: smooth_disk
      asset_path: configs/source_assets/cosmos_62410_hlr011.npz
