scopes:
  archived_cases:
    count: 1453
    source: archived_case_inventory.jobs
    routing: fresh standard runner using archived input identity
  new_top50_standard_cases:
    count: 112
    source: top50_missing_historical_nonlinear x standard_arms
    routing: pending position extraction, then fresh standard runner
  selected12_brackets:
    count: 36
    source: selected12 x [0.1, 0.2, 0.3] dex above each existing upper rung
    routing: bracket case generation, H1 truth anchor, then H0-only profile
  standard_arms: [asimov_injected, asimov_below, noisy_injected, noisy_control]
  standard_pair_count: 1565
  execution_catalog_count: 1601

mass_position_seed_policy:
  historical_cases: >-
    Preserve each archived row's exact config, positions artifact, rung,
    physical mass, position and primary noise seed binding.  Reconstruct the
    observation from these inputs under v7; do not import the archived fitted
    vector or sampler state.
  new_top50_cases: >-
    Preserve the v6 config, ladder artifact and source hash.  Extract the
    position artifact before dispatch.  The top arm uses the extracted top
    rung and the below arm uses the extracted below rung when available;
    noisy arms preserve the v6 configuration's primary global noise seed.
    Until extraction completes, mass and position fields remain explicitly
    pending and are never filled with estimates.
  selected12_brackets: >-
    Use each selected member's existing upper-rung position from its frozen
    injection_position.json.  Declare offsets of +0.1, +0.2 and +0.3 dex in
    log10(M200) and recompute physical subhalo parameters at generation time.
    No bracket fit artifact is claimed by this declaration.
  sampler_seed:
    entropy: 20260823
    spawn_key: [5, system_index, arm_index]
    arm_indices:
      asimov_injected: 0
      asimov_below: 3
      noisy_injected: 1
      noisy_control: 2
    noise_seed: preserve_declared_config_global_seed
  paired_seed_policy: >-
    Smooth and subhalo fits in one standard pair share the derived sampler
    seed.  This is a sampler reproducibility convention, not a claim of
    independent nested-sampling error.

runner_contract:
  entrypoint: scripts/run_nonlinear_production.py
  case_spec_argv: [case_spec_path]
  position_producer:
    entrypoint: scripts/extract_injection_positions.py
    argv: [config_path, v6_ladder_artifact_path, position_output_dir]
    output: injection_position.json
    completion_requirements:
      - system/config/ladder identity and SHA-256 bindings match
      - fit kernel shape is [51, 51]
      - every available top/below rung has finite mass and position
      - source asset and aperture identities are recorded
      - no nonlinear fit or search is executed by the producer
    downstream_requires_verified_hash: true
  dependency_policy:
    producer_must_complete_before_case_materialization: true
    missing_position_blocks_dispatch: true
    generated_bracket_case_must_bind_h1_anchor_hash: true
    future_hashes_forbidden: true
  underlying_runner: scripts/run_nonlinear_validation.py
  standard_argv: [config_path, positions_path, arm, output_dir]
  release_freeze_execution_path: /data/home/gvassilakis/nonlinear_release_20260917/stage3/worktree/configs/design/design_freeze_v7.yaml
  execution_policy_version: stage3_v7
  procedure_version: fresh_nonlinear_v7_lbfgsb_v1
  procedure_source_execution_path: /data/home/gvassilakis/nonlinear_release_20260917/stage3/worktree/src/hwoslaps/modeling/nonlinear/fresh_profile.py
  source_asset_execution_root: /data/home/gvassilakis/nonlinear_release_20260917/stage3/worktree/configs/source_assets
  bracket_mode: h0_bracket_adapter_owned_by_optimizer_stage3
  fresh_namespace_required: true
  archived_state_loading_forbidden: true
  pending_inputs_block_dispatch: true
  explicit_case_identity_environment:
    - HWOSLAPS_RELEASE_CASE_ID
    - HWOSLAPS_EXPECTED_CASE_SHA256
  physical_gpu_cap: 8
  max_workers_per_gpu: 3
  resource_policy: memory_gated
  launch_status: unapproved_pending_review
  approval_gate:
    required: true
    sidecar_status: PENDING_EXPLICIT_APPROVAL
    sidecar_path: /data/home/gvassilakis/nonlinear_release_20260917/stage3/APPROVAL.json
    sidecar_fields: [status, release_freeze_sha256, catalog_sha256,
                     authorized_gpu_limit, authorized_scope]
    verification: >-
      A runner route is admitted only when an immutable approval sidecar
      names this release-freeze digest and the exact generated catalog digest,
      carries status APPROVED, and authorizes the requested scope and GPU
      limit.  A user-editable boolean or a missing catalog digest is invalid.

duplicate_policy:
  archived_within_inventory: reject_nonzero_duplicate_case_signatures
  execution_catalog: unique_case_id_required
  cross_view_membership: intentional_view_overlap_must_be_listed
  archived_fit_state: never_loaded

reporting:
  retain_statuses: [READY_FRESH_SEARCH, PENDING_POSITION_EXTRACTION,
                    PENDING_BRACKET_GENERATION, FAILED, UNRESOLVED, COMPLETE]
  marginal_rule: abs_q_minus_10_lt_1
  area: unmeasured
  population_or_census_inference: false
  launch_authority: GPT_Pro_review_and_George_explicit_bulk_approval
