# Additive v7 release declaration for the fresh nonlinear campaign.
#
# This file is a preparation artifact.  It does not replace the ratified v5
# freeze and it does not authorize a launch.  The generator consumes this
# declaration together with the hash-bound C inventory and v6 ladder manifest.

schema_version: 7

freeze:
  name: design_freeze_v7_nonlinear_release
  version: 7
  status: prepared_not_ratified
  authored: '2026-09-17'
  purpose: >-
    Bind the reviewed fresh-search production package while preserving the
    ratified v5 science and the additive v6 ladder inputs.  All cases are
    prepared for fresh searches; archived fit vectors, posterior samples,
    evidence values, optimizer state and sampler checkpoints are identity
    references only and are never loaded as search state.
  launch_authority: >-
    Preparation only.  Bulk execution requires the separate GPT Pro review and
    George's explicit approval of the concrete manifest, allocation and cap.

consumed_freeze:
  path: configs/design/design_freeze_v1.yaml
  version: 5
  sha256: 7c6302ef4217573c0e2def0094844941922a04f050bd4fccfc7889b1b4341f75
  semantics: >-
    v5 remains the scientific authority for the detector, observing reference,
    source assets, lens/source distributions, mass mapping, PSF conventions,
    noise model and original ladder design.  v7 adds campaign routing and
    fresh-search procedure fields only.

protocol:
  fresh_searches: true
  reuse_archived_fit_state: false
  archived_case_policy: >-
    Archived aggregate artifacts bind the original case identity, input paths
    and historical scalar context.  They are not fit starts, posterior inputs,
    evidence inputs or optimizer checkpoints for v7.
  fallback_solver: false
  bracket_fisher_q:
    enabled_views: [selected12_brackets]
    kernel_shape_native: [999, 999]
    position: unchanged_upper_rung
    mass: current_shifted_mass
    other_cases: false
  tangent_comparator:
    enabled_views: [selected12_standard, selected12_brackets]
    other_cases: false
  sampler:
    n_eff: 500
    n_live_smooth: 100
    n_live_subhalo_search: 200
    n_live_subhalo_fixed: 100
    n_shell: 1
    discard_exploration: false
    f_live: 0.01
    f_live_status: >-
      Verified in the pinned backend. The execution adapter passes 0.01 and
      records the effective value before launch.
    retain_sampler_internals: true
    sampler_internals_note: >-
      The final v7 declaration requires raw sampler internals to be retained;
      the earlier Stage 2 smoke did not retain them and is diagnostic only.
  acceptance:
    distinct_original_starts: 2
    support_log_likelihood_tolerance: 0.1
    tighter_repeat_tolerance: 0.1
    diagnostic_tolerance: 0.01
    retain_best_observed_evaluation: true
    unresolved_policy: retain_and_report
  optimizer:
    solver: L-BFGS-B
    fresh_promising_vectors_only: true
    old_vectors_allowed: false
    no_fallback_solver: true
    current_search_optimization:
      original_start_count: 8
      start_separation_normalized_l2: 0.05
      maxiter: 500
      ftol: 0.0
      gtol: 1.0e-10
      maxls: 50
      scalar_residual_tolerance: 1.0e-4
    tighter_repeat:
      maxiter: 1000
      ftol: 0.0
      gtol: 1.0e-12
  identity:
    objective_version: consistent_sampling_v2
    generation_sub_size: 4
    fit_kernel_shape_native: [51, 51]
    fisher_kernel_shape_native: [999, 999]
    original_noise_and_seed_pairing: preserved_from_v5_inputs
    source_basis: preserved_from_v5_inputs

