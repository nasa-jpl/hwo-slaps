# HWO-SLAPS Configuration

# Run identification
run_name: fisher_paper_pilot_scan_loworder_global_segment
global_seed: 11  # null=random, int=reproducible 

# Output and plotting
plotting:
  enabled: true
  output_dir: outputs

# Lensing system generation
lensing:
  # Coordinate grid
  grid:
    shape: [500, 500]  # pixels
    pixel_scale: 0.00716  # arcsec/pixel
    
  # Main lens galaxy
  lens_galaxy:
    redshift: 0.2
    mass:
      type: Isothermal
      einstein_radius: 1  # arcsec
      centre: [0.0, 0.0]
      ell_comps: [0.1, 0.0]  # Ellipticity
      # PowerLaw alternative (replace this mass block):
      # type: PowerLaw
      # centre: [0.0, 0.0]
      # ell_comps: [0.1, 0.0]
      # einstein_radius: 1.0
      # slope: 2.0
      # multipoles:  # optional; phi_m = atan2(comp0, comp1) / m
      #   m3: [0.0, 0.01]
      #   m4: [0.02, 0.0]
    # shear: [0.02, -0.01]  # optional [gamma_1, gamma_2]
      
  # Background source galaxy
  source_galaxy:
    redshift: 0.6
    light:
      type: Exponential
      centre: [-0.03, 0.08]
      ell_comps: [0.14516129, 0.25142673]
      intensity: 2.0
      effective_radius: 0.11
      # Supported truth-side alternatives (replace this entire light block):
      # Sersic:
      #   type: Sersic
      #   centre: [-0.03, 0.08]
      #   ell_comps: [0.14516129, 0.25142673]
      #   intensity: 2.0
      #   effective_radius: 0.11
      #   sersic_index: 1.5  # required; 0.3 <= n <= 10
      # Clumpy:
      #   type: Clumpy
      #   host: {centre: [-0.03, 0.08], ell_comps: [0.14516129, 0.25142673], intensity: 2.0, effective_radius: 0.11, sersic_index: 1.0}
      #   clumps:  # required list of 1-4 explicit Sersic components
      #     - {centre: [0.00, 0.11], ell_comps: [0.0, 0.0], intensity: 0.3, effective_radius: 0.02, sersic_index: 1.0}
      #   flux_scale: 1.0  # required joint component-intensity scale
      #   size_scale: 1.0  # required joint size and clump-offset scale
      # Image:
      #   type: Image
      #   asset_path: /absolute/path/to/prepared_source.npz
      #   centre: [-0.03, 0.08]
      #   rotation_deg: 0.0
      #   total_flux: 0.29  # intensity units times arcsec^2
      #   flux_scale: 1.0  # required
      #   size_scale: 1.0  # required; fixed-SB similarity stretch
      
  # Dark matter subhalo
  subhalo:
    enabled: true  # Set to false to create system with no subhalo
    mass: 1.0e7  # Solar masses
    model: NFW  # PointMass, SIS, or NFW
    concentration:
      model: moline2017_eq7  # moline2017_eq7 or power_law
      x_sub: 1.0             # required for moline2017_eq7
      h: null                # null => infer from configured cosmology
    position:
      type: 'angle'         # 'random', 'angle', or 'direct'
      # Deterministic first branch-validation run: place the subhalo on the Einstein ring.
      angle: 90.0           # degrees (0-360), measured from +x toward +y
      offset_pixels: 0      # optional radial offset in pixels (default 0)
      # For random placement:
      # scatter_pixels: 20  # Random scatter ±10 pixels around Einstein ring
      # For direct placement only:
      # centre: [0.12, 0.81]  # [y, x] in arcseconds
    
  # Cosmology
  cosmology: Planck15

# PSF generation with aberrations
psf:
  # Telescope parameters
  telescope:
    gap_size: 0.006  # m
    segment_point_to_point: 1.65 # m
    pupil_diameter: 7.225765  # m
    num_rings: 2
    focal_length: 144.0  # m
    supersampling_factor: 4
    
  # High-resolution PSF parameters (for metrics calculation)
  hres_psf:
    num_pix: 512
    wavelength: 5.0e-7  # m
    num_airy: 12
    sampling: 5
    save_highres_psf_npy: false  # Save pre-downsampled PSF intensity as .npy
    
  # Kernel parameters (for PyAutoLens)
  kernel:
    shape_native: [51, 51]  # Final kernel dimensions
    
  # Aberrations
  aberrations:
    # Toggle flags to enable/disable each aberration type
    enable_segment_pistons: false       
    enable_segment_tiptilts: false
    enable_segment_hexikes: true
    enable_global_zernikes: false
    
    # Segment piston errors in nm 
    segment_pistons:
      0: 0.012  # 12 pm piston on segment 0
      1: 0.015  # 15 pm piston on segment 1
      2: 0.011  # 11 pm piston on segment 2
      3: 0.013  # 13 pm piston on segment 3
      4: 0.014  # 14 pm piston on segment 4
      5: 0.010  # 10 pm piston on segment 5
      6: 0.016  # 16 pm piston on segment 6
      7: 0.018  # 18 pm piston on segment 7
      8: 0.017  # 17 pm piston on segment 8
      9: 0.019  # 19 pm piston on segment 9
      10: 0.013 # 13 pm piston on segment 10
      11: 0.012 # 12 pm piston on segment 11
      12: 0.014 # 14 pm piston on segment 12
      13: 0.015 # 15 pm piston on segment 13
      14: 0.011 # 11 pm piston on segment 14
      15: 0.017 # 17 pm piston on segment 15
      16: 0.018 # 18 pm piston on segment 16
      17: 0.016 # 16 pm piston on segment 17
      18: 0.010 # 10 pm piston on segment 18

    # Segment tip/tilt errors in microradians
    segment_tiptilts:
      0: [0.000012, 0.000012]  # 12 pm equivalent tip/tilt on segment 0
      1: [0.000015, 0.000015]
      2: [0.000011, 0.000011]
      3: [0.000013, 0.000013]
      4: [0.000014, 0.000014]
      5: [0.000010, 0.000010]
      6: [0.000016, 0.000016]
      7: [0.000018, 0.000018]
      8: [0.000017, 0.000017]
      9: [0.000019, 0.000019]
      10: [0.000013, 0.000013]
      11: [0.000012, 0.000012]
      12: [0.000014, 0.000014]
      13: [0.000015, 0.000015]
      14: [0.000011, 0.000011]
      15: [0.000017, 0.000017]
      16: [0.000018, 0.000018]
      17: [0.000016, 0.000016]
      18: [0.000010, 0.000010]
      
    # Segment-level hexike aberrations in nm RMS (noll indexing)
    segment_hexikes:
      0: {1: 100}   # Segment 0: hexike Noll mode 1 with 100 nm
      1: {2: 100}   # Segment 1: hexike Noll mode 2 with 100 nm
      2: {3: 100}   # Segment 2: hexike Noll mode 3 with 100 nm
      3: {4: 100}   # Segment 3: hexike Noll mode 4 with 100 nm
      4: {5: 100}   # Segment 4: hexike Noll mode 5 with 100 nm
      5: {6: 100}   # Segment 5: hexike Noll mode 6 with 100 nm
      6: {7: 100}   # Segment 6: hexike Noll mode 7 with 100 nm
      7: {8: 100}   # Segment 7: hexike Noll mode 8 with 100 nm
      8: {9: 100}   # Segment 8: hexike Noll mode 9 with 100 nm
      9: {10: 100}  # Segment 9: hexike Noll mode 10 with 100 nm
      10: {11: 100} # Segment 10: hexike Noll mode 11 with 100 nm
      11: {12: 100} # Segment 11: hexike Noll mode 12 with 100 nm
      12: {13: 100} # Segment 12: hexike Noll mode 13 with 100 nm
      13: {14: 100} # Segment 13: hexike Noll mode 14 with 100 nm
      14: {15: 100} # Segment 14: hexike Noll mode 15 with 100 nm
      15: {16: 100} # Segment 15: hexike Noll mode 16 with 100 nm
      16: {17: 100} # Segment 16: hexike Noll mode 17 with 100 nm
      17: {18: 100} # Segment 17: hexike Noll mode 18 with 100 nm
      18: {19: 100} # Segment 18: hexike Noll mode 19 with 100 nm
      
    # Global Zernike aberrations in nm RMS
    global_zernikes:
      4: 5    # Focus (Z4)
      5: 5    # Coma X (Z7)
      8: 5    # Coma Y (Z8)

# Observation simulation parameters
observation:
  exposure_time: 900.0  # seconds
  # Dimensionless end-to-end system throughput applied to the source flux.
  # Two source normalizations are distinct and must both be tracked. The
  # configured profile intensities set a continuous angular surface-brightness
  # integral, int I d^2theta, over the source. The observation layer instead
  # consumes the rendered per-pixel profile samples directly as e-/pixel/s at
  # throughput 1.0, so the realized discrete detected rate is approximately
  # that continuous integral divided by the pixel area (5.12656e-5 arcsec^2 at
  # the 0.00716 arcsec/pixel grid above). Sky background and dark current are
  # already detected per-pixel rates and are not scaled.
  throughput: 1.0
  output_format: "pyautolens_ready"
  
  # Detector configuration
  detector:
    gain: 1.0           # e-/ADU
    read_noise: 0.2     # e-/pixel
    dark_current: 0.002 # e-/pixel/s
    sky_background: 1.0 # e-/pixel/s (zodiacal light dominated)

# Module 4: Subhalo Detection
modeling:
  enabled: true  # Set to true to enable detection mode
  detection: 'fisher'
  # Optional analysis-PSF treatment. Bank mode is nonlinear-only.
  # fit_psf:
  #   mode: matched               # matched | explicit | bank | delta
  #   # psf: {...}                # explicit only; complete top-level psf shape
  #   # bank:                     # required only for bank
  #   #   kind: prior_draws       # prior_draws | explicit
  #   #   prior_table: configs/psf_priors/jwst_wss_drift_v1.yaml
  #   #   amplitude_rms_nm: 20.0  # positive float or balanced list
  #   #   n_draws: 16             # prior_draws only; at least one
  #   #   seed: 20260811          # prior_draws only; non-negative integer
  #   #   include_perfect: false  # optional control anchor
  #   #   include_truth: false    # optional control anchor
  #   #   candidates: [...]       # explicit only; bare aberrations blocks
  #   # delta:                    # required only for delta
  #   #   prior_table: configs/psf_priors/jwst_wss_drift_v1.yaml
  #   #   amplitude_rms_nm: 20.0  # non-negative scalar knowledge error
  #   #   seed: 20260814          # non-negative integer
  #   #   family: combined        # combined | global | segment
  # Optional analysis-lens override; explicit replaces mass and shear.
  # fit_lens:
  #   mode: matched               # matched | explicit
  #   # lens_galaxy:              # required only for explicit; no redshift
  #   #   mass: {type: Isothermal, centre: [0.0, 0.0], ell_comps: [0.1, 0.0], einstein_radius: 1.0}
  #   #   shear: [0.01, 0.0]      # omitted means no fit-side shear
  fisher:
    mode: both                    # local | map | both
    snr_threshold: 3.0
    include_background_offset: true
    finite_diff:
      centre_arcsec: 1.0e-3
      einstein_radius_arcsec: 1.0e-3
      ell_comp: 1.0e-3
      slope: 1.0e-3
      multipole_comp: 1.0e-3
      shear_comp: 1.0e-3
      source_intensity_frac: 1.0e-2
      source_reff_frac: 1.0e-2
    mask_mode: source_snr         # source_snr | all_pixels | fixed_annulus
    # Fixed predeclared aperture; required for and only for fixed_annulus.
    # mask_annulus:
    #   inner_arcsec: 0.6         # >= 0
    #   outer_arcsec: 1.4         # > inner_arcsec
    #   centre: lens              # lens | grid; default lens
    # Scalar nuisance directions to profile; default all. Reserved words are
    # all, none, lens_only, source_only and lens_and_source; the prefix words
    # never select observation.background_offset_adu. An explicit list of
    # direction names is also accepted. PSF fit modes are unaffected.
    # nuisance_subset: lens_and_source
    include_psf_nuisance: false
    compute_psf_mode_scan: true
    mode_scan_z_tolerance: 1.0
    psf_mode_steps:
      segment_pistons: 1.0        # nm OPD
      segment_tiptilts: 0.1       # microradians
      segment_hexikes: 1.0        # nm RMS
      global_zernikes: 1.0        # nm RMS
    psf_mode_prior_sigmas:
      segment_hexikes: 5.0
      global_zernikes: 5.0
    psf_basis:
      segment_hexikes:
        segments: all
        mode_nolls: [1, 2]
      global_zernikes:
        mode_nolls: [4, 5, 6, 7, 8]
    scan_psf_mode_selection:
      segment_hexikes:
        segments: all
        mode_nolls: [1, 2]
      global_zernikes:
        mode_nolls: [4, 5, 6, 7, 8]
    # covariance_path: /absolute/path/to/noise_covariance.npy
    # prior_sigmas:
    #   lens.centre_y: 5.0e-3
    #   lens.centre_x: 5.0e-3
    #   lens.einstein_radius: 1.0e-2
    #   lens.slope: 5.0e-2
    #   lens.multipole_m3_1: 1.0e-2
    #   lens.multipole_m3_2: 1.0e-2
    #   lens.multipole_m4_1: 1.0e-2
    #   lens.multipole_m4_2: 1.0e-2
    #   lens.shear_1: 1.0e-2
    #   lens.shear_2: 1.0e-2
    #   source.centre_y: 5.0e-3
    #   source.centre_x: 5.0e-3
    # Example larger PSF scan basis:
    # psf_basis:
    #   segment_pistons:
    #     segments: all
    #   segment_tiptilts:
    #     segments: all
    #   segment_hexikes:
    #     segments: all
    #     mode_nolls: [1, 2, 3]
    #   global_zernikes:
    #     mode_nolls: [4, 5, 6]
    # fit_psf_mode_selection:
    #   segment_hexikes:
    #     segments: all
    #     mode_nolls: [1, 2]
    # scan_psf_mode_selection:
    #   global_zernikes:
    #     mode_nolls: [4, 5, 6]
    map:
      type: ring                  # ring | grid | explicit
      ring:
        num_angles: 24
        offset_pixels: 0.0
      grid:
        spacing_arcsec: 0.05      # node spacing; grid is centred on the lens mass centre
        half_width_arcsec: 1.5    # square half-width; 1.5" covers the ring with margin
        annulus: null             # optional {r_min_arcsec, r_max_arcsec} restriction
      explicit_positions_yx: null
      detection_q_threshold: 10.0 # SCDD threshold on q_F for the detectable-area product
      num_workers: 1              # grid template-generation worker processes (CPU)
      engine: reference           # reference | jax (batched JAX templates; ignores num_workers)
