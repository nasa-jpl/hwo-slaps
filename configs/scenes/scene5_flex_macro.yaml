# Scene 5 of 5 (Item 6 / roadmap L1a): flexible macro lens.
#
# Canonical scene with ONLY the macro lens changed (source held fixed
# relative to the legacy case, per the roadmap). Truth lens: elliptical
# power law with m=3/m=4 multipoles and external shear, every amplitude a
# population-typical value:
#   slope 2.08        - SLACS mean total-mass slope 2.078 +/- 0.027
#                       (Auger et al. 2010)
#   m4 amplitude 0.01 - boxy/discy isophote analogue a4/a ~ 1%, the
#                       O'Riordan & Vegetti (arXiv:2310.10714) fiducial;
#                       aligned with the lens major axis (phi_4 = 45 deg;
#                       phi_m = atan2(comp0, comp1)/m gives [0.0, -0.01])
#   m3 amplitude 0.005 - lopsidedness, observed weaker than m4;
#                       misaligned at phi_3 = 30 deg -> [0.005, 0.0]
#   shear 0.03        - between physical environment shear (~0.01-0.02)
#                       and the 0.03-0.05 clustering of fitted lens-model
#                       shears; angle distinct from lens axis and both
#                       multipoles ([0.0212132, -0.0212132])
# The analysis model is matched (no fit_lens block): the Fisher basis gains
# the 7 macro nuisances (slope, m3 x2, m4 x2, shear x2), and NO
# prior_sigmas are placed on them by design; the data alone must break the
# subhalo-multipole degeneracy (the marginalization cost is a scene-five
# headline). The legacy-SIE mismatch ablation lives in
# scene5_ablation_sie_fit.yaml.
#
# The subhalo block and the fisher map block are single-run placeholders;
# stage-two manifests override subhalo mass/position and map settings.
# PSF is perfect by definition; PSF states are sweep axes, never scene
# properties.

run_name: scene5_flex_macro
global_seed: 11

plotting:
  enabled: true
  output_dir: outputs

lensing:
  grid:
    shape: [500, 500]
    pixel_scale: 0.00716  # arcsec/pixel

  lens_galaxy:
    redshift: 0.2
    mass:
      type: PowerLaw
      einstein_radius: 1.0  # arcsec
      centre: [0.0, 0.0]
      ell_comps: [0.1, 0.0]
      slope: 2.08
      multipoles:  # phi_m = atan2(comp0, comp1) / m
        m3: [0.005, 0.0]   # amplitude 0.005, phi_3 = 30 deg
        m4: [0.0, -0.01]   # amplitude 0.01, phi_4 = 45 deg (major axis)
    shear: [0.0212132, -0.0212132]  # gamma = 0.03

  source_galaxy:
    redshift: 0.6
    light:
      type: Exponential
      centre: [-0.03, 0.08]
      ell_comps: [0.14516129, 0.25142673]
      intensity: 2.0
      effective_radius: 0.11

  subhalo:
    enabled: true
    mass: 1.0e7  # Solar masses
    model: NFW
    concentration:
      model: moline2017_eq7
      x_sub: 1.0
      h: null
    position:
      type: 'angle'
      angle: 90.0
      offset_pixels: 0

  cosmology: Planck15

psf:
  telescope:
    gap_size: 0.006  # m
    segment_point_to_point: 1.65  # m
    pupil_diameter: 7.225765  # m
    num_rings: 2
    focal_length: 144.0  # m
    supersampling_factor: 4

  hres_psf:
    num_pix: 512
    wavelength: 5.0e-7  # m
    num_airy: 12
    sampling: 5
    save_highres_psf_npy: false

  kernel:
    shape_native: [51, 51]

  # Perfect PSF: the scene definition carries no wavefront error.
  aberrations:
    enable_segment_pistons: false
    enable_segment_tiptilts: false
    enable_segment_hexikes: false
    enable_global_zernikes: false

observation:
  exposure_time: 900.0  # seconds
  throughput: 1.0
  output_format: "pyautolens_ready"

  detector:
    gain: 1.0           # e-/ADU
    read_noise: 0.2     # e-/pixel
    dark_current: 0.002 # e-/pixel/s
    sky_background: 1.0 # e-/pixel/s

modeling:
  enabled: true
  detection: 'fisher'
  fisher:
    mode: both
    snr_threshold: 3.0
    include_background_offset: true
    finite_diff:
      centre_arcsec: 1.0e-3
      einstein_radius_arcsec: 1.0e-3
      ell_comp: 1.0e-3
      slope: 1.0e-3
      multipole_comp: 1.0e-3
      shear_comp: 1.0e-3
      source_intensity_frac: 1.0e-2
      source_reff_frac: 1.0e-2
    mask_mode: source_snr
    include_psf_nuisance: false
    compute_psf_mode_scan: false
    mode_scan_z_tolerance: 1.0
    psf_mode_steps:
      segment_pistons: 1.0
      segment_tiptilts: 0.1
      segment_hexikes: 1.0
      global_zernikes: 1.0
    psf_mode_prior_sigmas:
      segment_hexikes: 5.0
      global_zernikes: 5.0
    psf_basis:
      segment_hexikes:
        segments: all
        mode_nolls: [1, 2]
      global_zernikes:
        mode_nolls: [4, 5, 6, 7, 8]
    scan_psf_mode_selection:
      segment_hexikes:
        segments: all
        mode_nolls: [1, 2]
      global_zernikes:
        mode_nolls: [4, 5, 6, 7, 8]
    map:
      type: grid
      ring:
        num_angles: 24
        offset_pixels: 0.0
      grid:
        spacing_arcsec: 0.05
        half_width_arcsec: 1.5
        annulus: null
      explicit_positions_yx: null
      detection_q_threshold: 10.0
      num_workers: 1
      engine: jax
