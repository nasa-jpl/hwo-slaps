name: Engine tests
on:
  push:
    branches: [main, rasti]
  pull_request:
  workflow_dispatch:
    inputs:
      backend: {description: Run the pinned scientific stack, type: boolean, default: false}
      gpu: {description: Run CUDA tests on an existing self-hosted GPU runner, type: boolean, default: false}
permissions: {contents: read}
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
        dependencies: [validated, latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '${{ matrix.python }}'}
      - run: python -m pip install 'setuptools>=77' wheel
      - if: matrix.dependencies == 'validated'
        run: python -m pip install -c constraints/validated.txt '.[validated]' pytest
      - if: matrix.dependencies == 'latest'
        run: python -m pip install --upgrade . pytest
      - run: python tools/run_core_tests.py tests -q
  scientific:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with: {python-version: '3.11', activate-environment: hwo-slaps-science-ci}
      - shell: bash -el {0}
        run: bash install.sh --cpu --env-name hwo-slaps-science-ci --reuse
      - shell: bash -el {0}
        env: {CUDA_VISIBLE_DEVICES: '', JAX_PLATFORMS: cpu, OMP_NUM_THREADS: '1',
              MKL_NUM_THREADS: '1', OPENBLAS_NUM_THREADS: '1', NUMEXPR_NUM_THREADS: '1'}
        run: |
          python tools/run_backend_tests.py \
            tests/fisher/test_fisher_statistics.py \
            'tests/scene/test_halo_numerics.py::test_nfw_tnfw_against_independent_density_cylinder[40.0]' \
            tests/scene/test_halo_numerics.py::test_singular_profiles_are_analytic_at_every_positive_radius \
            tests/scene/test_singular_integration.py::test_physical_singular_pixel_against_independent_polar_integral \
            tests/scene/test_singular_integration.py::test_unresolved_integral_raises_without_inventing_a_central_value \
            tests/observation/test_observation_padding.py \
            tests/inference/test_inference_image_gradients.py \
            tests/inference/test_inference_low_dimension.py \
            tests/inference/test_inference_recovery.py \
            tests/inference/test_inference_quality.py \
            tests/fisher/test_fisher_positions.py \
            tests/spectra/test_spectra_sed.py \
            tests/spectra/test_spectra_photometry.py \
            tests/optics/test_optics_kernels.py \
            -q -m 'not xtx_gpu and not xtx_multi_gpu'
  backend:
    if: github.event_name == 'workflow_dispatch' && inputs.backend
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: conda-incubator/setup-miniconda@fc2d68f6413eb2d87b895e92f8584b5b94a10167 # v3
        with: {python-version: '3.11', activate-environment: hwo-slaps-ci}
      - shell: bash -el {0}
        run: bash install.sh --cpu --env-name hwo-slaps-ci --reuse
      - shell: bash -el {0}
        env: {OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1', OPENBLAS_NUM_THREADS: '1', NUMEXPR_NUM_THREADS: '1'}
        run: python tools/run_backend_tests.py tests -q -m 'not xtx_gpu and not xtx_multi_gpu'
  gpu:
    if: github.event_name == 'workflow_dispatch' && inputs.gpu
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: bash -el {0}
        env: {JAX_ENABLE_X64: '1', XLA_PYTHON_CLIENT_PREALLOCATE: 'false', OMP_NUM_THREADS: '1',
              MKL_NUM_THREADS: '1', OPENBLAS_NUM_THREADS: '1', NUMEXPR_NUM_THREADS: '1'}
        run: python tools/run_backend_tests.py --require-gpu --numba-jit enabled tests -q -rs -m 'xtx_gpu and not xtx_multi_gpu'
